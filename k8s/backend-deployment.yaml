apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: find-my-ride

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: find-my-ride-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:

            - name: DATABASE_URL
              value: "postgresql://postgres:1658@postgres:5432/find_my_ride"
              
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: find-my-ride-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: find-my-ride-config
                  key: POSTGRES_USER

            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: find-my-ride-config
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: find-my-ride-config
                  key: POSTGRES_PORT

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: find-my-ride-secret
                  key: POSTGRES_PASSWORD

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: find-my-ride-secret
                  key: SECRET_KEY
            - name: ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: find-my-ride-config
                  key: ALGORITHM
            
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: find-my-ride-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES