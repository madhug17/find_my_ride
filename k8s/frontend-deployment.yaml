apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: find-my-ride

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: find-my-ride-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80