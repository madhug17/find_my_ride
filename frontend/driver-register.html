<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Registration — Find My Ride</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">

            <h1>Find My Ride</h1>
            <h2>Driver Registration</h2>
            <p class="subtitle">Join as a verified campus driver</p>

            <form id="driverRegisterForm">
                <div class="form-group">
                    <label for="driverName">Full Name</label>
                    <input type="text" id="driverName" placeholder="Driver Name" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="driverEmail">Email Address</label>
                    <input type="email" id="driverEmail" placeholder="driver@campus.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="driverPhone">Phone Number</label>
                    <input type="tel" id="driverPhone" placeholder="+91 9876543210" required autocomplete="tel">
                </div>

                <div class="form-group">
                    <label for="driverPassword">Password</label>
                    <input type="password" id="driverPassword" placeholder="Create password" required autocomplete="new-password">
                </div>

                <div class="input-row">
                    <div class="form-group">
                        <label for="vehicleNumber">Vehicle Number</label>
                        <input type="text" id="vehicleNumber" placeholder="TS09AB1234" required>
                    </div>

                    <div class="form-group">
                        <label for="vehicleType">Vehicle Type</label>
                        <select id="vehicleType" required>
                            <option value="">Select</option>
                            <option value="Car">Car</option>
                            <option value="Auto / Rickshaw">Auto / Rickshaw</option>
                            <option value="Bike / Scooter">Bike / Scooter</option>
                            <option value="Cab / SUV">Cab / SUV</option>
                        </select>
                    </div>
                </div>

                <button type="submit" style="margin-top: 10px;">
                    Register as Driver
                </button>
            </form>

            <div id="driverMessage" style="margin-top: 15px; font-weight: 600; font-size: 14px; text-align: center;"></div>

            <div class="auth-links">
                <p>Already registered? <a href="driver-login.html">Driver Login</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>

        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
