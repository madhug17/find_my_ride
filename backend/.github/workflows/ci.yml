name: find-my-ride
on:
  push: 
    branches: [main]
  pull:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: 
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: find_my_ride_test
        ports:
          - 5432:5432
        options: >-
           --health-cmd "pg_isready -U postgres -d find_my_ride_test"
           --health-interval 10s
           --health-timeout 5s
           --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set Up Python
        uses: actions/steps-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/find_my_ride_test
        run: |
          pytest

      - name: Check Python syntax
        run: |
          python -m compileall app

      - name: Build Docker image
        run: |
          docker build -t find-my-ride-backend .
