services:
  api:
    build: .
    container_name: find-my-ride-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: find-my-ride-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1658
      POSTGRES_DB: find_my_ride

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d find_my_ride"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: